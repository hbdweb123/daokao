平方公里 · 中国帝陵独有“共用一条总神道”</text>\n      <text x=\"78\" y=\"831\" font-size=\"11.2\" fill=\"#d9e8fa\">总神道：石牌坊(5间6柱11楼) → 大红门 → 碑亭 → 18对石像生(一站一卧) → 龙凤门 ｜ 2003 世遗</text>\n    </g>\n  </g>\n</svg>", "stations": [{"step": 0, "chip": "0. 概况与总神道", "title": "开场 + 陵区格局与独一无二的总神道", "time": "约 1.5 分钟", "isNew": false, "anchors": [{"text": "昌平天寿山南麓 · 约 40 平方公里 · 2003 世遗"}, {"text": "北倚天寿山、南临温榆河（背山面水）"}, {"text": "中国帝陵独有：13 陵共用一条总神道"}, {"text": "石牌坊(5间6柱11楼)→大红门→碑亭→18对石像生(一站一卧)→龙凤门"}], "shortOral": "各位朋友大家好，欢迎来到北京昌平天寿山南麓的<b>明十三陵</b>，<b>2003年</b>作为明清皇家陵寝扩展项目列入世界文化遗产。陵区占地约<b>40平方公里</b>，北靠天寿山、南临温榆河，三面环山背山面水。这里有个中国帝陵里独一份的设计——<b>十三座皇陵共用一条总神道</b>！从南往北依次是：五间六柱十一楼的<b>石牌坊</b>、正门<b>大红门</b>、<b>碑亭</b>、<b>18对石像生</b>（6种瑞兽+文武勋臣，一对站一对卧象征仪仗），最后过<b>龙凤门</b>。", "fullText": "各位游客朋友们，大家好！欢迎来到明十三陵。我是今天的导游。咱们现在站在北京昌平天寿山南麓，眼前这片群山环抱的盆地，埋着明朝迁都北京以后的十三位皇帝。二零零三年，它作为明清皇家陵寝的扩展项目，被列入世界文化遗产名录。\n\n先说格局。整个陵区约四十平方公里，北面天寿山作屏障，东、西、南三面山势回环，温榆河从前面流过，是典型的背山面水、藏风聚气。十三座陵各自依山而建，共用一条总神道，也就是长陵神道。从南往北走，依次是五间六柱十一楼的石牌坊、大红门、碑亭、神道两侧的石像生，再到龙凤门。石像生一共十八对，狮、獬豸、骆驼、象、麒麟、马各两对，武臣、文臣、勋臣各两对，一对站一对卧，象征帝王生前的仪仗。一条神道统摄十三座陵，这种共用神道的做法，在中国帝陵里是独有的。"}, {"step": 1, "chip": "1. 卜陵选址与建陵原因", "title": "长陵卜陵选址与营造（1409 永乐七年）", "time": "约 1 分钟", "isNew": false, "anchors": [{"text": "1409 年（永乐七年）朱棣派廖均卿等择地"}, {"text": "原名黄土山 → 赐名“天寿山”"}, {"text": "三理由：山势环抱 + 近京畿便祭祀 + 天子守边"}], "shortOral": "为什么皇陵选在这儿？<b>1409年（永乐七年）</b>朱棣准备迁都北京，派风水师<b>廖均卿</b>等四处勘察，选中昌平这片黄土山，赐名<b>天寿山</b>。选它有三个硬理由：一是三面环山、地形绝佳；二是紧挨京城，方便后代祭祀；三是呼应朱棣“<b>天子守边</b>”的战略布局。从1409年长陵动工到最后崇祯葬入思陵，延续了两百多年。", "fullText": "为什么会选在这儿？明永乐七年，朱棣决定迁都北京，派礼部官员和风水师廖均卿等人四处择地，最后看中昌平这片黄土山，赐名天寿山。选它有三个理由：一是山势完整、三面环抱，符合依山为陵的传统；二是紧邻京畿，便于后代四时祭祀；三是天子守边、陵寝在京北，也和迁都的整体布局相配。从这年营建长陵起，到最后崇祯葬入思陵，前后延续两百多年。"}, {"step": 2, "chip": "2. 16帝缺哪3位", "title": "明朝未葬入十三陵的 3 位皇帝（高频必问）", "time": "约 1 分钟", "isNew": false, "anchors": [{"text": "明朝 16 帝，16 - 3 = 13 位在此", "danger": true}, {"text": "缺①：开国朱元璋（葬南京明孝陵）"}, {"text": "缺②：建文帝朱允炆（靖难后下落不明）"}, {"text": "缺③：景泰帝朱祁钰（葬北京西郊金山）· 崇祯算在13内"}], "shortOral": "游客最爱问：明朝16位皇帝，怎么只有13座陵？缺的三位记清楚：第一，开国皇帝<b>朱元璋</b>葬在<b>南京明孝陵</b>；第二，<b>建文帝</b>靖难之役后<b>下落不明</b>，没有陵；第三，<b>景泰帝</b>因英宗复辟被废，以亲王礼葬在北京西郊<b>金山</b>。16减3正好13！特别提醒：末代<b>崇祯皇帝</b>葬在最南边的<b>思陵</b>，他是算在这13座里面的。", "fullText": "有的朋友会问，明朝十六位皇帝，怎么只有十三座陵？缺的三位分别是：开国的朱元璋葬在南京孝陵；建文帝靖难之后下落不明，没有陵寝；景泰帝朱祁钰因英宗复辟被废，以亲王礼葬在北京西郊金山，虽然后来恢复帝号，也没有迁进陵区。十六减三，正好十三。崇祯皇帝自缢后葬在原来的田贵妃墓里，就是陵区最南边的思陵，所以他是算在这十三座之内的。这一点常被说混，咱们今天一次说清楚。"}, {"step": 3, "chip": "3. 十三陵名与帝陵规制", "title": "各陵名称 + “前方后圆”帝陵统一规制", "time": "约 1 分钟", "isNew": false, "anchors": [{"text": "13陵名：长献景裕茂，泰康永昭定，庆德思"}, {"text": "统一规制：前方后圆（陵墓是宫殿的镜像）"}, {"text": "前：祾恩门 → 祾恩殿（享殿祭祀）"}, {"text": "后：明楼 → 宝城宝顶（底下即地宫）"}], "shortOral": "十三座陵名拆成三句顺口溜：<b>长献景裕茂、泰康永昭定、庆德思</b>。每座陵长啥样？记住“<b>前方后圆</b>”四个字就通了，它就是生前皇宫的地下镜像：前面方形院落是<b>祾恩门、祾恩殿</b>（相当于前朝，供祭祀用）；后面圆形是<b>明楼、宝城和宝顶</b>，大土堆宝顶底下就是埋棺材的<b>地宫</b>。今天咱们重点看两座：最早最大的长陵，和唯一发掘过的定陵。", "fullText": "十三座陵沿山势依次是：长陵、献陵、景陵、裕陵、茂陵、泰陵、康陵、永陵、昭陵、定陵、庆陵、德陵、思陵。每座陵的规制大体一致，都是前方后圆：前面是祾恩门、祾恩殿组成的祭祀院落，后面是明楼、宝城、宝顶，宝顶之下就是地宫；只是规模大小随国力和在位时间而有差别。今天咱们重点看两座，一座最早的长陵，一座唯一发掘过的定陵。"}, {"step": 4, "chip": "4. 长陵 · 朱棣生平", "title": "长陵 · 永乐皇帝朱棣生平", "time": "约 1 分钟", "isNew": false, "anchors": [{"text": "明太祖第四子 · 封燕王 · 靖难即位（年号永乐）"}, {"text": "五大功绩：迁都北京 + 建紫禁城 + 永乐大典 + 郑和七下西洋 + 五征漠北"}, {"text": "病逝于榆木川"}], "shortOral": "先走进位于陵区正中、规模最大的<b>长陵</b>，墓主人是<b>明成祖朱棣</b>。他是朱元璋第四个儿子，早年封燕王守北平，靠“<b>靖难之役</b>”当上皇帝，年号永乐。他在位干了五件惊天动地的大事：<b>迁都北京、建紫禁城、编《永乐大典》、派郑和七下西洋、五次亲征漠北</b>，最后病逝在征途上的<b>榆木川</b>。可以说今天北京城的底子，就是他打下的。", "fullText": "请随我进长陵。它的主人是明成祖朱棣，明太祖第四子，早年封燕王驻守北平，通过靖难之役即位，年号永乐。他在位期间迁都北京、营建紫禁城、命人编纂永乐大典、派郑和七下西洋，又五次亲征漠北，最后病逝于榆木川。可以说，北京今天这座城的底子，就是他打下的。"}, {"step": 5, "chip": "5. 长陵 · 祾恩殿", "title": "长陵核心 · 祾恩殿（60 根整根金丝楠木）", "time": "约 1 分钟", "isNew": false, "anchors": [{"text": "读音注意：祾(léng)恩殿（感恩受福）", "danger": true}, {"text": "面阔 9 间、进深 5 间 · 重檐庑殿顶（同太和殿等级）"}, {"text": "60 根整根金丝楠木巨柱 · 全国现存最大最完整楠木大殿"}, {"text": "功能：供奉帝后神位、举行隆重祭祀"}], "shortOral": "长陵最震撼的是它的核心享殿——<b>祾（léng）恩殿</b>，“祾恩”意思是感恩受福，专门用来供奉帝后神位、举行大祭。它<b>面阔9间、进深5间，重檐庑殿顶</b>，规格和故宫太和殿平起平坐！进殿抬头看，撑起大殿的是<b>60根整根金丝楠木巨柱</b>，最粗的两人合抱都围不过来，是全国现存规模最大、保存最完整的楠木大殿。", "fullText": "长陵的核心建筑是祾恩殿。请您进殿抬头：它面阔九间、进深五间，重檐庑殿顶，等级和故宫太和殿相同；殿内不用一根普通木料，全靠六十根整根金丝楠木巨柱支撑，中间几根两人合抱都围不拢，是全国现存规模最大、保存最完整的楠木大殿。祾恩二字，取感恩受福之意，这里是供奉帝后神位、举行隆重祭祀的地方，殿外还有焚帛炉、配殿和明楼。站在殿里，能直观感到明代皇家祭礼的分量。"}, {"step": 6, "chip": "6. 定陵 · 万历生平与发掘", "title": "定陵 · 万历皇帝生平（2026新增）+ 1956 发掘转折", "time": "约 1.5 分钟", "isNew": true, "anchors": [{"text": "万历朱翊钧（2026 新增必讲！）：10岁登基 · 张居正一条鞭法", "danger": true}, {"text": "在位 48 年明代最久 · 后期不上朝 · 建陵 6 年耗银 800 万两"}, {"text": "1956 试掘 · 1957 找金刚墙开地宫（唯一主动发掘帝陵）"}, {"text": "转折意义：此后国家确立“不主动发掘帝王陵”原则"}], "shortOral": "接着咱们去长陵西南方的<b>定陵</b>，墓主人是<b>明神宗万历皇帝朱翊钧</b>（2026必讲点）：他<b>10岁登基</b>，前期靠名相<b>张居正推行一条鞭法</b>一度中兴，在位整整<b>48年</b>是明朝在位最久的皇帝，可后期多年不上朝，还花了<b>6年、800万两白银</b>给自己修这座豪华陵墓。定陵最大的特殊在于它是迄今<b>唯一经国家批准主动发掘的帝王陵</b>：<b>1956年</b>试掘、<b>1957年</b>找到金刚墙打开地宫；也是因为这次发掘后文物保护的教训，国家正式确立了“<b>不再主动发掘帝王陵</b>”的原则。", "fullText": "接下来咱们去定陵。墓主人是明神宗万历皇帝朱翊钧，十岁登基，前期由张居正辅政、推行一条鞭法，在位四十八年，是明代在位最久的皇帝，后期多年不上朝。他的陵墓从万历十二年开始营建，历时六年，耗银八百万两。\n\n定陵之所以特殊，因为它是迄今唯一一座经国家批准、主动发掘的帝王陵。一九五六年五月开始试掘，一九五七年找到金刚墙、打开地宫，此后国家确立了不主动发掘帝王陵的原则，所以这份实物资料格外珍贵。"}, {"step": 7, "chip": "7. 定陵地宫与金井玉葬", "title": "定陵地宫（地下 27 米五石殿 · 自来石 · 金井玉葬）", "time": "约 1.5 分钟", "isNew": false, "anchors": [{"text": "地下 27 米 · 1000 多㎡ · 前中后左右五座无梁石殿"}, {"text": "入口：汉白玉石门 + 背后斜顶“自来石”"}, {"text": "中殿：三宝座+五供+长明灯 · 后殿：三棺椁+26朱漆箱"}, {"text": "金井玉葬（棺床孔置玉料五谷）· 出土 3000+件（金丝翼善冠/凤冠）"}], "shortOral": "走下<b>地下27米</b>，就进了定陵地宫！一千多平米分成<b>前、中、后、左、右五座石殿</b>，全用巨石起拱、无梁无柱。入口两扇汉白玉石门背后，靠一根机关巨石“<b>自来石</b>”顶死。<b>中殿</b>摆着三张汉白玉宝座、琉璃五供和长明灯；<b>后殿</b>停放万历与两位皇后的三具棺椁和26只随葬红漆箱。棺床正中挖了个小孔叫<b>金井</b>，里面放玉料和五谷象征接通地气，这就是“<b>金井玉葬</b>”。这里出土了<b>3000多件国宝</b>，最绝的就是皇帝的<b>金丝翼善冠</b>和皇后的<b>凤冠</b>！", "fullText": "地宫在地面以下约二十七米，总面积一千多平方米，由前、中、后、左、右五座石殿组成，全部用巨石起拱，无梁无柱。入口处两扇汉白玉石门，背后用一根自来石斜顶着，当年考古人员正是想办法挪开它才进入地宫。中殿设三个汉白玉宝座，前设琉璃五供和长明灯；后殿是主室，正中棺床上并列停放万历皇帝与孝端皇后、孝靖皇后的棺椁，两侧摆着二十六只朱漆木箱随葬品。棺床正中留有一孔，叫金井，内置玉料、五谷，取接通地气、护佑亡者之意，这种葬式就是常说的金井玉葬。地宫共出土三千多件文物，最著名的是金丝翼善冠、嵌珍珠宝石的凤冠、青花瓷器与成匹的织金锦，把晚明工艺水平摆在了咱们眼前。"}, {"step": 8, "chip": "8. 总结与世遗收尾", "title": "一部躺下来的明史 + 2003 世遗收尾", "time": "约 0.5 分钟", "isNew": false, "anchors": [{"text": "1409 长陵起 → 崇祯思陵止（200 余年）"}, {"text": "2003 年列入世界文化遗产"}, {"text": "金句升华：十三座陵 = 一部躺下来的明史"}], "shortOral": "各位朋友，从1409年朱棣选下天寿山建长陵，到最后崇祯草草葬入思陵，这两百多年其实是一部“<b>躺下来的明史</b>”：前期的开阔、中期的奢靡、末世的仓皇，全刻在陵寝的规模里。<b>2003年</b>明十三陵列入世界文化遗产，它不只是地下宫殿，更是一个王朝的起落见证。我的讲解到此结束，谢谢大家！", "fullText": "各位朋友，从永乐七年选下天寿山，到崇祯草草葬入思陵，十三座陵其实是一部躺下来的明史：前期的开阔、中期的奢靡、末世的仓皇，都写在陵的规模里。今天咱们看的不只是地下宫殿，更是一个王朝两百多年的起落。\n\n明十三陵的讲解就到这里，谢谢大家。接下来请自由参观，我们按约定时间在门口集合。"}], "audios": ["audio/shisanling/step_0.mp3", "audio/shisanling/step_1.mp3", "audio/shisanling/step_2.mp3", "audio/shisanling/step_3.mp3", "audio/shisanling/step_4.mp3", "audio/shisanling/step_5.mp3", "audio/shisanling/step_6.mp3", "audio/shisanling/step_7.mp3", "audio/shisanling/step_8.mp3"]}];
const STORAGE_KEY = "daokao_oral_all6_done_v3";

let doneMap = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
let currentSpotIdx = 0;
let activeStep = 0;
let isPlaying = false;
let currentRate = 1.0;
let autoNextTimer = null;

const audioEl = document.getElementById("voicePlayer");
const playMainBtn = document.getElementById("playMainBtn");
const guideNowTitle = document.getElementById("guideNowTitle");
const guideTime = document.getElementById("guideTime");
const seekSlider = document.getElementById("seekSlider");
const autoNextToggle = document.getElementById("autoNextToggle");

function getSpot() { return SPOTS[currentSpotIdx]; }
function getDoneSet(spotId) { return new Set(doneMap[spotId] || []); }
function saveDoneSet(spotId, setObj) {
  doneMap[spotId] = [...setObj];
  localStorage.setItem(STORAGE_KEY, JSON.stringify(doneMap));
}

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) return "00:00";
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(Math.floor(sec % 60)).padStart(2, "0");
  return `${m}:${s}`;
}

function clearAutoNext() {
  if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
}

function stopAudio() {
  clearAutoNext();
  audioEl.pause();
  audioEl.removeAttribute("src");
  audioEl.dataset.loadedKey = "";
  isPlaying = false;
  seekSlider.value = 0;
  guideTime.textContent = "00:00 / 00:00";
}

function renderTabs() {
  const tabsEl = document.getElementById("spotTabs");
  tabsEl.innerHTML = "";
  SPOTS.forEach((sp, i) => {
    const dset = getDoneSet(sp.id);
    const total = sp.stations.length;
    const btn = document.createElement("button");
    btn.className = "spot-tab" + (i === currentSpotIdx ? " active" : "") + (dset.size >= total ? " all-done" : "");
    btn.innerHTML = `${sp.short_name} <span class="tab-dot">${dset.size}/${total}</span>`;
    btn.onclick = () => switchSpot(i);
    tabsEl.appendChild(btn);
  });

  const dice = document.createElement("button");
  dice.className = "dice-btn";
  dice.textContent = "🎲 随机抽签";
  dice.title = "模拟机考随机抽 1 个景点";
  dice.onclick = () => {
    let nxt = Math.floor(Math.random() * SPOTS.length);
    if (nxt === currentSpotIdx && SPOTS.length > 1) nxt = (nxt + 1) % SPOTS.length;
    switchSpot(nxt);
  };
  tabsEl.appendChild(dice);
}

function switchSpot(idx) {
  stopAudio();
  currentSpotIdx = idx;
  activeStep = 0;
  const sp = getSpot();
  if (location.hash !== `#${sp.id}`) {
    history.replaceState(null, "", `#${sp.id}`);
  }
  renderSpot();
  document.getElementById("rightCol").scrollTo({ top: 0, behavior: "auto" });
}

function renderSpot() {
  const sp = getSpot();
  const dset = getDoneSet(sp.id);
  renderTabs();

  // 注入当前景点 SVG 地图并绑定节点点击事件
  const svgWrap = document.getElementById("svgWrap");
  svgWrap.innerHTML = sp.svg;
  svgWrap.querySelectorAll(".map-node").forEach(node => {
    node.addEventListener("click", () => {
      const step = Number(node.dataset.step);
      playFromStep(step, true);
    });
  });

  // 官方题签
  document.getElementById("ticketTitle").textContent = `📋 2026 北京机考屏幕原题签 · ${sp.name}（${sp.badge}）`;
  document.getElementById("ticketText").innerHTML = sp.ticket_html;

  const chipsEl = document.getElementById("ticketChips");
  const listEl = document.getElementById("cardsList");
  chipsEl.innerHTML = "";
  listEl.innerHTML = "";

  document.getElementById("allFullSummary").textContent = `📖 完整对照文本（${sp.name} · 约 1,600 字完整原讲稿全文，想通读时再展开）`;
  document.getElementById("allFullText").textContent = sp.stations.map(s => `【${s.title}】\n${s.fullText}`).join("\n\n");
  document.getElementById("allFullDetails").open = false;

  sp.stations.forEach(st => {
    const chip = document.createElement("button");
    chip.className = "t-chip" + (dset.has(st.step) ? " done" : "") + (activeStep === st.step ? " active" : "");
    chip.textContent = st.chip;
    chip.dataset.step = st.step;
    chip.onclick = () => playFromStep(st.step, true);
    chipsEl.appendChild(chip);

    const card = document.createElement("article");
    card.className = "station-card" + (dset.has(st.step) ? " done" : "") + (activeStep === st.step ? " active" : "");
    card.id = `card-${st.step}`;
    card.dataset.step = st.step;

    const anchorsHtml = st.anchors.map(a =>
      `<span class="anchor-pill ${a.danger ? "danger" : ""}">${a.danger ? "⚠️ " : ""}${a.text}</span>`
    ).join("");

    card.innerHTML = `
      <div class="card-audio-bar" id="bar-${st.step}"></div>
      <div class="card-header" onclick="selectStep(${st.step}, false)">
        <div class="card-title-wrap">
          <span class="step-badge">${st.step}</span>
          <span class="card-title">${st.title}</span>
          ${st.isNew ? '<span class="tag-new">2026 重点/新增</span>' : ''}
          <span class="tag-time">${st.time}</span>
        </div>
        <div class="card-actions" onclick="event.stopPropagation()">
          <button class="mini-btn play-step-btn" id="speak-${st.step}" onclick="toggleStepPlay(${st.step})">🔊 从这站听</button>
          <button class="mini-btn ${dset.has(st.step) ? "checked" : ""}" onclick="toggleDone(${st.step})">
            ${dset.has(st.step) ? "✓ 已顺嘴" : "标为顺嘴"}
          </button>
        </div>
      </div>

      <div class="peek-bar">
        <button class="peek-btn" onclick="togglePeek(${st.step}, 'anchor')">👁 偷看锚点提示</button>
        <button class="peek-btn" onclick="togglePeek(${st.step}, 'oral')">💬 偷看简洁口述</button>
      </div>

      <div class="anchor-box" id="anchor-${st.step}">${anchorsHtml}</div>

      <div class="short-oral" id="oral-${st.step}">
        <div class="short-oral-label">
          <span>🗣️ 简洁大白话口述（晓晓音频同步这一段）</span>
          <span>跟着听 · 跟着顺</span>
        </div>
        <p>${st.shortOral.replace(/\n/g, "<br>")}</p>
      </div>

      <div class="full-wrap" id="full-${st.step}">
        <details>
          <summary>📄 完整原讲稿对照（本段 1,600 字版原文）</summary>
          <div class="full-text">${st.fullText}</div>
        </details>
      </div>
    `;
    listEl.appendChild(card);
  });

  guideNowTitle.textContent = `准备就绪（${sp.name}）：点黄色按钮，晓晓带你从 0 站听到 ${sp.stations.length - 1} 站`;
  syncVisualStates();
}

function syncVisualStates() {
  const sp = getSpot();
  const dset = getDoneSet(sp.id);

  document.getElementById("progressPill").textContent = `已过 ${dset.size} / ${sp.stations.length} 站`;
  document.body.classList.toggle("is-playing", isPlaying);

  playMainBtn.classList.toggle("playing", isPlaying);
  playMainBtn.textContent = isPlaying
    ? `⏸ 暂停（正在听第 ${activeStep} 站）`
    : (audioEl.dataset.loadedKey === `${sp.id}:${activeStep}` && audioEl.currentTime > 0 && !audioEl.ended
        ? `▶ 继续听第 ${activeStep} 站`
        : "▶ 从头带我听一遍");

  document.querySelectorAll(".t-chip").forEach(el => {
    const step = Number(el.dataset.step);
    el.classList.toggle("active", step === activeStep);
    el.classList.toggle("done", dset.has(step));
  });

  document.querySelectorAll(".station-card").forEach(el => {
    const step = Number(el.dataset.step);
    el.classList.toggle("active", step === activeStep);
    el.classList.toggle("done", dset.has(step));
    const btn = document.getElementById(`speak-${step}`);
    if (btn) {
      const activeHere = isPlaying && step === activeStep;
      btn.classList.toggle("speaking", activeHere);
      btn.textContent = activeHere ? "⏸ 正在播…" : "🔊 从这站听";
    }
    if (step !== activeStep) {
      const bar = document.getElementById(`bar-${step}`);
      if (bar) bar.style.width = "0%";
    }
  });

  document.querySelectorAll("#svgWrap .map-node").forEach(el => {
    const step = Number(el.dataset.step);
    el.classList.toggle("active", step === activeStep);
    el.classList.toggle("done", dset.has(step));
  });
}

function selectStep(step, scrollCard) {
  activeStep = step;
  syncVisualStates();
  if (scrollCard) {
    const card = document.getElementById(`card-${step}`);
    const container = document.getElementById("rightCol");
    if (card && container && window.innerWidth > 960) {
      const targetTop = card.offsetTop - container.offsetTop - 16;
      container.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });
    } else if (card) {
      card.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }
}

function playFromStep(step, scrollCard = true) {
  clearAutoNext();
  const sp = getSpot();
  activeStep = step;
  const st = sp.stations[step];
  const key = `${sp.id}:${step}`;
  if (audioEl.dataset.loadedKey !== key) {
    audioEl.src = sp.audios[step];
    audioEl.dataset.loadedKey = key;
  } else {
    audioEl.currentTime = 0;
  }
  audioEl.playbackRate = currentRate;
  guideNowTitle.textContent = `🔊 ${sp.name} · 第 ${step} 站：${st.title}`;
  selectStep(step, scrollCard);

  const p = audioEl.play();
  if (p && p.then) {
    p.then(() => { isPlaying = true; syncVisualStates(); })
     .catch(err => { console.error(err); isPlaying = false; syncVisualStates(); });
  }
}

function toggleStepPlay(step) {
  clearAutoNext();
  const sp = getSpot();
  const key = `${sp.id}:${step}`;
  if (isPlaying && activeStep === step) {
    audioEl.pause();
    isPlaying = false;
    syncVisualStates();
  } else if (!isPlaying && activeStep === step && audioEl.dataset.loadedKey === key && audioEl.currentTime > 0 && !audioEl.ended) {
    audioEl.playbackRate = currentRate;
    audioEl.play();
    isPlaying = true;
    syncVisualStates();
  } else {
    playFromStep(step, true);
  }
}

playMainBtn.addEventListener("click", () => {
  clearAutoNext();
  const sp = getSpot();
  const key = `${sp.id}:${activeStep}`;
  if (isPlaying) {
    audioEl.pause();
    isPlaying = false;
    syncVisualStates();
  } else if (audioEl.dataset.loadedKey === key && audioEl.currentTime > 0 && !audioEl.ended) {
    audioEl.playbackRate = currentRate;
    audioEl.play();
    isPlaying = true;
    syncVisualStates();
  } else {
    const startIdx = (activeStep === sp.stations.length - 1 && audioEl.ended) ? 0 : activeStep;
    playFromStep(startIdx, true);
  }
});

document.getElementById("prevStepBtn").addEventListener("click", () => {
  playFromStep(Math.max(0, activeStep - 1), true);
});
document.getElementById("nextStepBtn").addEventListener("click", () => {
  const sp = getSpot();
  playFromStep(Math.min(sp.stations.length - 1, activeStep + 1), true);
});

audioEl.addEventListener("timeupdate", () => {
  const cur = audioEl.currentTime || 0;
  const dur = audioEl.duration || 0;
  guideTime.textContent = `${fmtTime(cur)} / ${fmtTime(dur)}`;
  if (dur > 0) {
    const pct = (cur / dur) * 100;
    seekSlider.value = pct;
    const bar = document.getElementById(`bar-${activeStep}`);
    if (bar) bar.style.width = `${pct}%`;
  }
});

seekSlider.addEventListener("input", () => {
  const dur = audioEl.duration || 0;
  if (dur > 0) audioEl.currentTime = (Number(seekSlider.value) / 100) * dur;
});

audioEl.addEventListener("ended", () => {
  const sp = getSpot();
  const dset = getDoneSet(sp.id);
  dset.add(activeStep);
  saveDoneSet(sp.id, dset);
  renderTabs();
  const bar = document.getElementById(`bar-${activeStep}`);
  if (bar) bar.style.width = "100%";

  if (autoNextToggle.checked && activeStep < sp.stations.length - 1) {
    const next = activeStep + 1;
    guideNowTitle.textContent = `✅ 第 ${activeStep} 站听完，1.2 秒后自动进入第 ${next} 站…`;
    syncVisualStates();
    autoNextTimer = setTimeout(() => { playFromStep(next, true); }, 1200);
  } else {
    isPlaying = false;
    guideNowTitle.textContent = activeStep === sp.stations.length - 1
      ? `🎉 ${sp.name} 全部 ${sp.stations.length} 站听完！现在可以切到「② 提词练嘴」自己开口顺一遍`
      : `✅ 第 ${activeStep} 站播放完毕`;
    syncVisualStates();
  }
});

document.querySelectorAll(".speed-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentRate = Number(btn.dataset.rate);
    audioEl.playbackRate = currentRate;
    document.querySelectorAll(".speed-btn").forEach(b => b.classList.toggle("active", b === btn));
  });
});

function toggleDone(step) {
  const sp = getSpot();
  const dset = getDoneSet(sp.id);
  if (dset.has(step)) dset.delete(step);
  else dset.add(step);
  saveDoneSet(sp.id, dset);
  renderSpot();
}

function togglePeek(step, type) {
  if (type === "anchor") document.getElementById(`anchor-${step}`).classList.toggle("peek");
  else document.getElementById(`oral-${step}`).classList.toggle("peek");
}

const blindToggle = document.getElementById("blindMapToggle");
blindToggle.addEventListener("change", () => {
  document.getElementById("mapPanel").classList.toggle("blind-map", blindToggle.checked);
});

function toggleMobileMap() {
  const panel = document.getElementById("mapPanel");
  const btn = document.getElementById("mobileMapToggle");
  const collapsed = panel.classList.toggle("collapsed");
  btn.textContent = collapsed ? "🗺️ 展开图" : "🗺️ 收起图";
}

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const mode = btn.dataset.mode;
    document.body.className = `mode-${mode}` + (isPlaying ? " is-playing" : "");
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".peek").forEach(el => el.classList.remove("peek"));
    if (mode === "exam") {
      blindToggle.checked = true;
      document.getElementById("mapPanel").classList.add("blind-map");
    } else if (mode === "learn") {
      blindToggle.checked = false;
      document.getElementById("mapPanel").classList.remove("blind-map");
    }
  });
});

// 13分钟倒计时
const TOTAL_SEC = 13 * 60;
let remainSec = TOTAL_SEC;
let timerId = null;

function updateTimerUI() {
  const disp = document.getElementById("timerDisplay");
  const abs = Math.abs(remainSec);
  const m = String(Math.floor(abs / 60)).padStart(2, "0");
  const s = String(abs % 60).padStart(2, "0");
  disp.textContent = (remainSec < 0 ? "-" : "") + `${m}:${s}`;
  disp.className = "timer-display";
  if (remainSec <= 0) disp.classList.add("over");
  else if (remainSec <= 60) disp.classList.add("warn");
  else if (remainSec <= 180) disp.classList.add("good");
}

document.getElementById("timerToggle").addEventListener("click", function() {
  if (timerId) {
    clearInterval(timerId);
    timerId = null;
    this.textContent = "继续";
  } else {
    timerId = setInterval(() => { remainSec--; updateTimerUI(); }, 1000);
    this.textContent = "暂停";
  }
});
document.getElementById("timerReset").addEventListener("click", () => {
  if (timerId) { clearInterval(timerId); timerId = null; }
  remainSec = TOTAL_SEC;
  document.getElementById("timerToggle").textContent = "开始";
  updateTimerUI();
});

// 支持按 URL hash 初始化指定景点（如 #gugong）
const initHash = (location.hash || "").replace(/^#/, "");
const foundIdx = SPOTS.findIndex(s => s.id === initHash);
currentSpotIdx = foundIdx >= 0 ? foundIdx : 0;

renderSpot();
updateTimerUI();
</script>
